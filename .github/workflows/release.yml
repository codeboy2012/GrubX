name: GrubX Release

# Builds every artifact this pipeline can produce and validates integrity.
# Publishing is explicit and guarded: a GitHub draft release is created ONLY
# when the run is triggered with confirm_publish=true. Never overwrites, never
# pushes, never deletes anything.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Human-readable release version (defaults to package.json version)"
        required: false
        default: ""
      confirm_publish:
        description: "Set literally to true to create a DRAFT GitHub release (human review required afterwards)"
        required: true
        default: "false"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web build (desktop + mobile same codebase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build production bundle
        run: pnpm build
        env:
          # Same single-port runtime contract as manage.sh
          PORT: 9000
          BASE_PATH: /
      - name: Web result summary
        run: echo "Next.js build OK — served from source via ./manage.sh; no separate deploy artifact."

  android:
    name: Android universal APK (phone/tablet + Android TV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Hosted ubuntu runners ship a full Android SDK (ANDROID_HOME preset)
      # with licenses pre-accepted; AGP resolves platform/build-tools/NDK itself.
      - name: Install native dependencies
        working-directory: native
        run: pnpm install --frozen-lockfile
      - name: Typecheck native JS
        working-directory: native
        run: pnpm exec tsc --noEmit
      # native/android is Continuous Native Generation output and is git-ignored;
      # CI regenerates it from app.json + the pinning plugins before Gradle.
      - name: Prebuild native Android project
        working-directory: native
        run: npx expo prebuild -p android --no-install
      - name: Build release APK
        working-directory: native/android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Integrity checks
        id: integrity
        run: |
          APK=native/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT2" dump badging "$APK")
          echo "$BADGING" | grep "^package:" | grep -q "org.grubx.app" || { echo "::error::bad package id"; exit 1; }
          echo "$BADGING" | grep -q "leanback-launchable" || { echo "::error::leanback launcher missing"; exit 1; }
          echo "$BADGING" | grep -q "uses-feature-not-required: name='android.software.leanback'" || { echo "::error::leanback must be required=false"; exit 1; }
          VERSION_NAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+" | head -1)
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$APK" > apk-sha256.txt
          cat apk-sha256.txt
      - name: Rename for release
        run: cp native/android/app/build/outputs/apk/release/app-release.apk grubx-android-universal-release.apk
      - name: Upload workflow artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: grubx-android-universal-apk
          path: |
            grubx-android-universal-release.apk
            apk-sha256.txt
          if-no-files-found: error

  ios-tvos-check:
    name: iOS/tvOS documentation check (no artifacts possible on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify honest state
        run: |
          test -f docs/APPLE_TV.md || { echo "::error::docs/APPLE_TV.md missing"; exit 1; }
          grep -q "ios-unsigned" native/eas.json
          grep -q "tvos-production" native/eas.json
          if ls native/ios/build/*.ipa 2>/dev/null || find . -name "*.ipa" 2>/dev/null | head -1 | grep -q .; then
            echo "::error::An IPA exists but this pipeline cannot have built it — investigate provenance instead of publishing."
            exit 1
          fi
          echo "No IPA/tvOS artifact exists in this checkout; the documented macOS route (EAS or local Xcode) is the only supported path."

  github-release:
    name: Create DRAFT release (blocked unless confirm_publish=true)
    runs-on: ubuntu-latest
    needs: [web, android, ios-tvos-check]
    if: inputs.confirm_publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grubx-android-universal-apk
          path: release-assets
      - name: Stage draft
        run: |
          VERSION_NAME="${{ inputs.version_name }}"
          [ -n "$VERSION_NAME" ] || VERSION_NAME="$(node -p "require('./package.json').version")"
          test -f release-assets/grubx-android-universal-release.apk
          test -f release-assets/apk-sha256.txt
          mkdir -p draft
          cp release-assets/grubx-android-universal-release.apk "draft/grubx-${VERSION_NAME}-android-universal-release.apk"
          {
            echo "sha256 checksums for this release:"
            cat release-assets/apk-sha256.txt
            echo
            echo "iOS/tvOS: no artifacts — unsigned iOS builds require a macOS Xcode toolchain"
            echo "(route: native/eas.json ios-unsigned / tvos-production; docs/APPLE_TV.md)."
          } > draft/SHA256SUMS-and-caveats.txt
          ls -la draft
      - name: Create draft release only
        run: |
          VERSION_NAME="${{ inputs.version_name }}"
          [ -n "$VERSION_NAME" ] || VERSION_NAME="$(node -p "require('./package.json').version")"
          gh release create "v${VERSION_NAME}" \
            --draft \
            --title "GrubX ${VERSION_NAME} (draft — publish after human review)" \
            --notes "See SHA256SUMS-and-caveats.txt; run scripts/collect-release-artifacts.sh locally for full notes." \
            draft/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
