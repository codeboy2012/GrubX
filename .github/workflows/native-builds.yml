name: GrubX Native

on:
  push:
    branches: ["main"]
    paths: ["native/**", ".github/workflows/native-builds.yml"]
  pull_request:
    branches: ["main"]
    paths: ["native/**", ".github/workflows/native-builds.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: native/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: native
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: native
        run: pnpm exec tsc --noEmit

      - name: Lint
        working-directory: native
        run: pnpm exec eslint src

      - name: Validate app config and EAS profile JSON
        working-directory: native
        run: |
          node -e "JSON.parse(require('fs').readFileSync('app.json','utf8')); console.log('app.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('eas.json','utf8')); console.log('eas.json OK')"

  artifacts:
    # Release artifacts (phone/TV APKs, unsigned iOS IPA, tvOS build) are
    # produced with EAS Build, which requires Expo account credentials that are
    # intentionally not stored in CI. Run locally from native/:
    #
    #   npx eas-cli@latest build -p android --profile phone-production  # phone APK
    #   npx eas-cli@latest build -p android --profile tv-production     # Android TV APK
    #   npx eas-cli@latest build -p ios --profile ios-unsigned          # unsigned IPA
    #   npx eas-cli@latest build -p ios --profile tvos-production       # Apple TV build
    #
    # EAS signs Android with a managed keystore and produces iOS builds without
    # a distribution certificate when credentials are skipped
    # (`eas build --non-interactive --profile ios-unsigned` after `eas credentials`
    # is configured, or `--local` with fastlane installed).
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Artifact production requires EAS credentials
        run: |
          echo "This job is a documentation stub: EAS Build needs an authenticated"
          echo "Expo account. Authenticate with 'eas login' (interactive) or set"
          echo "EXPO_TOKEN as an Actions secret to automate artifact builds."
          exit 0
